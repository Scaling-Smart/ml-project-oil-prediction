name: Build and Push Docker Image for SDP Frontend API

on:
  push:
    branches: [image] # or any branch you want to trigger on

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push prod
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile.prod
          push: true
          tags: ghcr.io/scaling-smart/sdp-control-plane/frontend/sdp-frontend-api:v1.0.3

      - name: Build and push uat
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile.uat
          push: true
          tags: ghcr.io/scaling-smart/sdp-control-plane/frontend/sdp-frontend-api:uat-v1.0.3
