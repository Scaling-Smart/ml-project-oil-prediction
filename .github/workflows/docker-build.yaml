name: Docker Build and Push

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      version:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      context:
        required: true
        type: string

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ${{ inputs.image }}
      VERSION: ${{ inputs.version }}
      DOCKERFILE: ${{ inputs.dockerfile }}
      CONTEXT: ${{ inputs.context }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image name (lowercased)
        id: set-image-name
        run: |
          REPO_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG=$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')
          FULL_IMAGE_NAME="ghcr.io/${REPO_LOWER}/${IMAGE_TAG}:${VERSION}"

          echo "FULL_IMAGE_NAME=$FULL_IMAGE_NAME" >> $GITHUB_ENV
          echo "full_image_name=$FULL_IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/${{ env.DOCKERFILE }}
          tags: ${{ env.FULL_IMAGE_NAME }}
          push: true
